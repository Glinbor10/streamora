name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  # Public SHA-256 fingerprint of the release signing certificate. Changing the
  # signing key requires changing this value (intended).
  EXPECTED_CERT_SHA256: c2138dc8bc2a5e929e12991e6e8e0b7130d879c85a4fc6dbcd0916c8e24b32aa

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true
      - name: Restore keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for v in KEYSTORE_B64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!v}" ]; then
              echo "::error::Release signing secret for $v is missing; refusing to build an unsigned or debug-signed release."
              exit 1
            fi
          done
          echo "$KEYSTORE_B64" | base64 -d > android/app/release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties
      - run: flutter pub get
      - run: flutter build apk --release --split-per-abi
      - name: Name the APKs
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mv build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "streamore-android-arm64-${TAG}.apk"
          mv build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "streamore-android-armv7-${TAG}.apk"
      - name: Verify the signing certificate
        run: |
          set -euo pipefail
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          for apk in streamore-android-*.apk; do
            # Every signer certificate digest must equal the expected one
            # (output wording differs between build-tools versions).
            digests=$("$APKSIGNER" verify --print-certs --verbose "$apk" 2>/dev/null | grep 'certificate SHA-256 digest:' | grep -oE '[0-9a-fA-F]{64}' | sort -u)
            echo "$apk signer digest(s): $digests"
            if [ "$digests" != "$EXPECTED_CERT_SHA256" ]; then
              echo "::error::$apk is not signed with the expected release certificate."
              exit 1
            fi
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: android
          path: streamore-android-*.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Portable zip
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath "streamore-windows-$env:TAG-portable.zip"
      - name: Installer (Inno Setup)
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          choco install innosetup -y --no-progress
          $v = $env:TAG.TrimStart('v')
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$v" "/DTag=$env:TAG" installer\streamora.iss
      - name: MSIX package (Microsoft Store upload)
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $v = $env:TAG.TrimStart('v')
          .\msix\pack.ps1 -Version "$v.0" -OutDir msix-artifact
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows
          path: |
            streamore-windows-*-portable.zip
            streamore-windows-*-setup.exe
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: msix-store
          path: msix-artifact/*.msix

  release:
    needs: [android, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      # Intentionally download only the public artifacts: the unsigned MSIX is
      # for Partner Center and must not be published on GitHub Releases.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: android
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: windows
          path: dist
      - name: Checksums
        run: |
          cd dist
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          generate_release_notes: true
          files: dist/*
