name: Screenshots

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'test/screenshots/**'
      - 'test/brand/**'
      - 'lib/**'
      - '.github/workflows/screenshots.yml'

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Render screens and icons
        run: |
          SCREENSHOTS_DIR="$PWD/screens" ICONS_DIR="$PWD/brand"             flutter test test/screenshots test/brand
      - uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: screens/*.png
      - uses: actions/upload-artifact@v7
        with:
          name: brand
          path: brand/*.png
