name: Screenshots

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'test/screenshots/**'
      - 'test/brand/**'
      - 'lib/**'
      - '.github/workflows/screenshots.yml'

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Render screens and icons
        run: |
          SCREENSHOTS_DIR="$PWD/screens" ICONS_DIR="$PWD/brand"             flutter test test/screenshots test/brand
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: screenshots
          path: screens/*.png
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: brand
          path: brand/*.png
